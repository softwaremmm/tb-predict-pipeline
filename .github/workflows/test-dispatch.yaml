name: Test-send-dispatch
on: [push]

jobs:
  build:
    name: Send dispatch
    runs-on: ubuntu-latest

    steps:
    - name: Send a dispatch
      run: |
        sudo apt update && sudo apt install -y curl
        curl -L -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{secrets.PAT_TOKEN}}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/GlobalPathogenAnalysisService/gpas-tb-workflow/actions/workflows/test_action.yaml/dispatches \
          -d '{"ref": "test-action"}'
          